# ==============================================================================
# GITHUB ACTIONS WORKFLOW: BACKEND CI/CD (AWS CDK INFRASTRUCTURE & LAMBDAS)
# ==============================================================================
# Dedicated pipeline for aws-training-backend repository.
# Builds and deploys backend services and AWS infrastructure stacks.
# ==============================================================================

name: Backend Quality Gate & AWS Infrastructure Deployment

on:
  push:
    branches:
      - develop
      - staging
      - main

jobs:
  quality-gate-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            amplify/package.json

      - name: Map Git Branch to Environment Stage Name
        id: stage
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "STAGE=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            echo "STAGE=staging" >> $GITHUB_OUTPUT
          else
            echo "STAGE=develop" >> $GITHUB_OUTPUT
          fi

      # ------------------------------------------------------------------------
      # STEP 1: Backend Service Quality Gate (Typecheck, Lint, Test, Build)
      # ------------------------------------------------------------------------
      - name: Install Backend Dependencies
        run: npm ci

      - name: Typecheck Backend Code
        run: npm run typecheck

      - name: Lint Backend Code
        run: npm run lint

      - name: Run Backend Unit Tests
        run: npm run test

      - name: Build Lambda Functions
        run: npm run build

      # ------------------------------------------------------------------------
      # STEP 2: Deploy AWS Backend Infrastructure Stack (DynamoDB, SQS, SNS, IAM, API)
      # ------------------------------------------------------------------------
      - name: Install Amplify Gen 2 Infrastructure Dependencies
        working-directory: amplify
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Typecheck Amplify Gen 2 Infrastructure Definitions
        working-directory: amplify
        run: npm run typecheck

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}

      - name: Deploy Backend Infrastructure Stack (AWS CDK)
        working-directory: amplify
        env:
          STAGE: ${{ steps.stage.outputs.STAGE }}
        run: |
          echo "================================================================="
          echo "DEPLOYING BACKEND INFRASTRUCTURE STACK FOR STAGE: [${STAGE}]"
          echo "================================================================="
          npx cdk bootstrap
          npx cdk deploy --all -c env="${STAGE}" --require-approval never

      # ------------------------------------------------------------------------
      # STEP 3: Update Producer and Consumer Lambda Function Code
      # ------------------------------------------------------------------------
      - name: Update Producer Lambda Function Code
        env:
          STAGE: ${{ steps.stage.outputs.STAGE }}
        run: |
          FUNCTION_NAME="PlayerOnboardingProducer-${STAGE}"
          aws lambda update-function-code --function-name "$FUNCTION_NAME" --zip-file fileb://dist/producer.zip || echo "Warning: Lambda $FUNCTION_NAME update pending initial stack creation."

      - name: Update Consumer Lambda Function Code
        env:
          STAGE: ${{ steps.stage.outputs.STAGE }}
        run: |
          FUNCTION_NAME="PlayerOnboardingConsumer-${STAGE}"
          aws lambda update-function-code --function-name "$FUNCTION_NAME" --zip-file fileb://dist/consumer.zip || echo "Warning: Lambda $FUNCTION_NAME update pending initial stack creation."
